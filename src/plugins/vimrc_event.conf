# Example events that allow the reporter to attach vim configuration files
# whenever vim crash is reported.

EVENT=collect_vimrc_user component=vim
        vimrc=~/.vimrc
        gvimrc=~/.gvimrc
        saved=none
        if [ -r $vimrc -a -f $vimrc ]; then
                rm -f user_vimrc && dd if="$vimrc" of=user_vimrc oflag=nofollow conv=excl status=none || exit $?
                saved="$saved, user_vimrc"
        else
                echo "File $vimrc not found"
        fi
        if [ -r $gvimrc -a -f $gvimrc ]; then
                rm -f user_gvimrc && dd if="$gvimrc" of=user_gvimrc oflag=nofollow conv=excl status=none || exit $?
                saved="$saved, user_gvimrc"
        else
                echo "File $gvimrc not found"
        fi
        echo "Elements saved: ${saved#none, }"

EVENT=collect_vimrc_system component=vim
        vimrc=/etc/vimrc
        gvimrc=/etc/gvimrc
        saved=none
        if [ -r $vimrc -a -f $vimrc ]; then
                rm -f system_vimrc && dd if="$vimrc" of=system_vimrc oflag=nofollow conv=excl status=none || exit $?
                saved="$saved, system_vimrc"
        else
                echo "File $vimrc not found"
        fi
        if [ -r $gvimrc -a -f $gvimrc ]; then
                rm -f system_gvimrc && dd if="$gvimrc" of=system_gvimrc oflag=nofollow conv=excl status=none || exit $?
                saved="$saved, system_gvimrc"
        else
                echo "File $gvimrc not found"
        fi
        echo "Elements saved: ${saved#none, }"
