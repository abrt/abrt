EVENT=post-create type=xorg remote!=1
	# Blacklist known binary-only modules.
	# Generate duplicate detection hashes.
	abrt-action-analyze-xorg
	#
	# Get versions of binaries listed in Xorg backtrace
	abrt-action-list-dsos -m backtrace -o dso_list
	#
	test -f /var/log/Xorg.0.log && rm -f Xorg.0.log && dd if=/var/log/Xorg.0.log of=Xorg.0.log oflag=nofollow conv=excl status=none
	test -f /etc/X11/xorg.conf && rm -f xorg.conf && dd if=/etc/X11/xorg.conf of=xorg.conf oflag=nofollow conv=excl status=none
	test -d /etc/X11/xorg.conf.d && rm -f etc_X11_xorg_conf_d.tar.gz && tar cz /etc/X11/xorg.conf.d | dd of=etc_X11_xorg_conf_d.tar.gz oflag=nofollow conv=excl status=none
	test -d /usr/share/X11/xorg.conf.d && rm -f usr_share_xorg_conf_d.tar.gz && tar cz /usr/share/X11/xorg.conf.d | dd of=usr_share_xorg_conf_d.tar.gz oflag=nofollow conv=excl status=none
	#
	# append instead of overwrite is due to bugzilla.redhat.com/show_bug.cgi?id=854266
	dmesg | dd of=dmesg oflag=nofollow,append conv=notrunc status=none
	#
	# save lspci -vvv output?

EVENT=report_Bugzilla type=xorg
	reporter-bugzilla -b
	# TODO? -F /etc/libreport/plugins/bugzilla_format_xorg.conf

# Automatic/simple GUI-based xorg problems reporting will do this:
EVENT=report-gui type=xorg
	report-gtk -- "$DUMP_DIR"

EVENT=report-cli type=xorg
	report-cli -- "$DUMP_DIR"

EVENT=report_systemd-journal type=xorg
    reporter-systemd-journal --message-id 6a9a2826cc074934bff0dd0a45a10453 \
                             -F /etc/libreport/plugins/catalog_xorg_format.conf
