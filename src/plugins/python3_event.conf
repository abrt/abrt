EVENT=post-create type=Python3 remote!=1
        # (For now this has no effect since python hook doesn't save environ)
        if grep -q ^ABRT_IGNORE_ALL=1 environ \
        || grep -q ^ABRT_IGNORE_PYTHON=1 environ \
        ; then
            echo "ABRT_IGNORE variable is 1 - not saving the crash"
            # abrtd will delete the problem directory when we exit nonzero:
            exit 1
        fi
        abrt-action-analyze-python
        # Save the Python interpreter package name as the "interpreter"
        # element. The cmdline file comes from /proc/PID/cmdline and is
        # user-controllable (an attacker can set argv[0] to any string
        # via execvp). rpm -qf expands RPM macros such as %{lua:...} in
        # path arguments, so passing unsanitized cmdline data to it would
        # allow arbitrary code execution as root (ZDI-CAN-31734).
        #
        # Extract the interpreter command (first word of cmdline).
        interpreter_cmd=$(cut -d' ' -f1 < cmdline)
        # Resolve the command to an absolute path ("|| true" so that a
        # lookup failure does not abort the event handler).
        interpreter_path=$(command -v -- "$interpreter_cmd" 2>/dev/null) || true
        # Resolve all symlinks to the real binary path. An attacker can
        # create a symlink to python3 with macro syntax in the filename;
        # realpath strips that away by returning the final target.
        if [ -n "$interpreter_path" ]; then
            interpreter_path=$(realpath -e -- "$interpreter_path" 2>/dev/null) || true
        fi
        # Defense-in-depth: reject any path that still contains '%' so
        # that an RPM macro can never reach rpm -qf.
        if [ -n "$interpreter_path" ] && [ "${interpreter_path##*%*}" != "" ]; then
            for line in $(rpm -qf -- "$interpreter_path" 2>/dev/null); do
                rm -f interpreter && echo -n "$line" | dd of=interpreter oflag=nofollow conv=excl status=none
            done
        fi

EVENT=report_Bugzilla type=Python3 component!=anaconda
        test -f component || abrt-action-save-package-data
        reporter-bugzilla -b \
                -c /etc/libreport/plugins/bugzilla.conf \
                -F /etc/libreport/plugins/bugzilla_format.conf \
                -A /etc/libreport/plugins/bugzilla_formatdup.conf

# Send micro report
EVENT=report_uReport type=Python3
        /usr/libexec/abrt-action-ureport

# update ABRT database after successful report to bugzilla
EVENT=post_report type=Python3
        reporter-ureport -A -B

# Reporting of python exceptions
EVENT=report-gui type=Python3 component!=anaconda
        report-gtk -- "$DUMP_DIR"

EVENT=report-cli type=Python3 component!=anaconda
        report-cli -- "$DUMP_DIR"

EVENT=report_systemd-journal type=Python3
        reporter-systemd-journal --message-id 4d6f95dd9ff54eb7bd1f32a387f327c3 \
                                  -F /etc/libreport/plugins/catalog_python3_format.conf
